<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta charset="UTF-8">
    <title>Status Update</title>
    <script src="{{ url_for('static', filename ='status.js') }}" defer>
    </script>
</head>
<body>

    <div class="title">
        <h1>Status Update</h1>

    </div>

    <p id="form-message" role="alert"></p>

    <div class="statusbox">

        <h2>Current Status</h2>
        <p>Status: <em id="current-status">{{ data[0] }}</em> </p>
        <p>Location: <em id="current-location">{{ data[1] }} </em></p>
        <p>Last Updated: <em id="last-updated"> {{ data[2] }}</em></p>
        <p>Reason: <em id="current-reason"> {{ data[3] }}</em></p>

    </div>

    <div class="statusform">
        <h3>Status Update Form</h3>
        <form id="status-form">
            <input id="status" type="text" placeholder="Enter your status *" maxlength="25">
            <input id="location" type="text" placeholder="Enter your location" maxlength="25">
            <input id="reason" type="text" placeholder="Enter your reason *" maxlength="25">

            <button type="submit">Update Status</button>
        </form>

    </div>


</body>
</html>
